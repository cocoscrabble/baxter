[package]
name = "scrabble-pairing"
version = "0.1.0"
edition = "2021"
description = "Pairing engine for Scrabble tournaments (Swiss, King-of-the-Hill, round robin, quads, …)"
# Crate's own code is dual MIT OR Apache-2.0 (Rust convention). The vendored
# matching module (src/vendor/) is Apache-2.0 — see ATTRIBUTION.md.
license = "MIT OR Apache-2.0"
repository = "https://github.com/coco/scrabble-pairing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Seeded RNG only — no getrandom / OS entropy, so the crate stays wasm-clean.
rand_chacha = "0.3"
rand_core = "0.6"
# Dependencies of the vendored max_weight_matching module (src/vendor/). All
# wasm-clean; we do NOT depend on rustworkx-core itself (it hard-pulls rayon).
petgraph = "0.8"
hashbrown = "0.15"
indexmap = "2"
foldhash = "0.1"
