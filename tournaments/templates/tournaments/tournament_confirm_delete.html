{% extends "base.html" %}

{% block title %}Delete Tournament - Baxter{% endblock %}

{% block breadcrumbs %}
<span class="nav-sep">/</span>
<a href="{% url 'tournament_detail' tournament.slug %}">{{ tournament.name }}</a>
{% endblock %}

{% block content %}
<h1>Delete Tournament</h1>

<p>Are you sure you want to delete "{{ tournament.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'tournament_detail' tournament.slug %}">Cancel</a>
</form>
{% endblock %}
