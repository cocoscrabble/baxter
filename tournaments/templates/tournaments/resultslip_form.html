{% extends "base.html" %}

{% block title %}Add Result - {{ division.name }} - Baxter{% endblock %}

{% block content %}
<h1>Add Result</h1>
<p>Division: {{ division.name }}</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<p><a href="{% url 'division_detail' division.pk %}">Cancel</a></p>
{% endblock %}
