{% extends "tournaments/base_division.html" %}
{% load static %}

{% block title %}Edit Board → Table Map - {{ division.name }} - {{ division.tournament.name }} - Baxter{% endblock %}

{% block content %}
<h1>Board → Table Map: {{ division.name }}</h1>

<link rel="stylesheet" href="{% static 'tabulator-tables/dist/css/tabulator.min.css' %}">
<script src="{% static 'tabulator-tables/dist/js/tabulator.min.js' %}"></script>

<div class="generate-form" style="margin-bottom: 1em; display: flex; align-items: center; gap: 1em;">
    <label>Single tables: <input type="number" id="single-tables" min="0" value="0" style="width: 5em;"></label>
    <label>Total boards: <input type="number" id="board-count" min="1" value="{{ default_board_count }}" style="width: 5em;"></label>
    <button id="generate-btn" type="button">Generate</button>
</div>

<div id="board-table-map-table"></div>

<p style="margin-top: 1em;">
    <button id="add-row-btn" type="button">Add Row</button>
    <button id="save-btn" type="button">Save</button>
    <span id="save-status"></span>
</p>

<script>
const pageData = {
    boardTableMap: {{ board_table_map_json|safe }},
    defaultBoardCount: {{ default_board_count }},
    csrfToken: "{{ csrf_token }}",
};
</script>
<script src="{% static 'tournaments/js/edit_board_table_map.js' %}"></script>
{% endblock %}
