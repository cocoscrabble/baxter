{% extends "base.html" %}
{% load static %}

{% block title %}Edit Entrants - {{ division.name }} - {{ division.tournament.name }} - Baxter{% endblock %}

{% block content %}
<h1>Edit Entrants: {{ division.name }}</h1>
<p>Tournament: <a href="{% url 'tournament_detail' division.tournament.pk %}">{{ division.tournament.name }}</a></p>
<p><a href="{% url 'division_detail' division.pk %}">Back to division</a></p>

<link rel="stylesheet" href="{% static 'tabulator-tables/dist/css/tabulator.min.css' %}">
<script src="{% static 'tabulator-tables/dist/js/tabulator.min.js' %}"></script>

<div id="entrants-table"></div>

<p style="margin-top: 1em;">
    <button id="add-row-btn" type="button">Add Row</button>
    <button id="save-btn" type="button">Save</button>
    <span id="save-status"></span>
</p>

<script>
const players = {{ players_json|safe }};
const initialData = {{ entrants_json|safe }};
const csrfToken = "{{ csrf_token }}";

const playerLookup = {};
players.forEach(p => { playerLookup[p.id] = p.label; });

const playerValues = {};
players.forEach(p => { playerValues[p.id] = p.label; });

const table = new Tabulator("#entrants-table", {
    data: initialData,
    layout: "fitColumns",
    columns: [
        {
            title: "#",
            field: "number",
            width: 60,
            hozAlign: "center",
        },
        {
            title: "Player",
            field: "player",
            editor: "list",
            editorParams: { values: playerValues },
            formatter: function(cell) {
                return playerLookup[cell.getValue()] || "";
            },
        },
        {
            title: "",
            formatter: function() { return "<button type='button'>X</button>"; },
            width: 50,
            hozAlign: "center",
            headerSort: false,
            cellClick: function(e, cell) {
                cell.getRow().delete();
                renumber();
            },
        },
    ],
});

function renumber() {
    const rows = table.getRows();
    rows.forEach((row, i) => {
        row.update({ number: i + 1 });
    });
}

document.getElementById("add-row-btn").addEventListener("click", function() {
    const count = table.getDataCount();
    table.addRow({ number: count + 1, player: null });
});

document.getElementById("save-btn").addEventListener("click", function() {
    renumber();
    const data = table.getData();
    const rows = data.map(r => ({
        number: r.number,
        player: parseInt(r.player) || null,
    }));

    const statusEl = document.getElementById("save-status");
    statusEl.textContent = "Saving...";

    fetch("", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
        },
        body: JSON.stringify({ entrants: rows }),
    })
    .then(resp => resp.json().then(body => ({ ok: resp.ok, body })))
    .then(({ ok, body }) => {
        if (ok && body.ok) {
            statusEl.textContent = "Saved!";
        } else {
            statusEl.textContent = "Error: " + (body.errors || []).join("; ");
        }
    })
    .catch(err => {
        statusEl.textContent = "Network error.";
    });
});
</script>
{% endblock %}
