<div id="standings-content">
{% if rounds %}
<div class="round-tabs">
    {% for r in rounds %}
    <a href="#"
       class="round-tab round-tab-finished{% if r == round %} active{% endif %}"
       data-on:click__prevent="@get('{% url 'division_standings_round' division.tournament.slug division.slug r %}')">{{ r }}</a>
    {% endfor %}
</div>
{% endif %}

<div id="round-tab-content">
<div class="round-header">
<h2>After round {{ round }}</h2>
</div>
{% if standings %}
<div class="table-scroll table-narrow">
{% include "tournaments/_standings_table.html" %}
</div>
{% else %}
{% include "tournaments/_empty_state.html" with message="No results yet." %}
{% endif %}
</div>
</div>
