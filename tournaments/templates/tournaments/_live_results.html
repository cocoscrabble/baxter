<table class="live-table">
    <thead>
        <tr>
            <th class="num">Round</th>
            <th>Winner</th>
            <th class="num">Score</th>
            <th>Opponent</th>
        </tr>
    </thead>
    <tbody>
        {% for slip in rows %}
        <tr>
            <td class="num">{{ slip.round }}</td>
            <td>{{ slip.winner.display_name }}</td>
            <td class="num">{{ slip.winner_score }}-{{ slip.loser_score }}</td>
            <td>{{ slip.loser.display_name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
