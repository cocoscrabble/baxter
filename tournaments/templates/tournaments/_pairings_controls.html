<div id="pairings-controls">
{% if can_edit %}
<p>
{% if has_draft_rounds %}
<form method="post" action="{% url 'publish_pairings' division.pk %}" class="inline">
    {% csrf_token %}
    <button type="submit" class="btn-publish-needed">Publish Pairings</button>
</form>
{% endif %}
{% if has_published_rounds %}
<a href="{% url 'published_pairings' division.pk %}" target="_blank" rel="noopener">View published pairings page</a>
{% endif %}
</p>
{% if waiting_message %}
<p>{{ waiting_message }}</p>
{% endif %}
{% endif %}
</div>
