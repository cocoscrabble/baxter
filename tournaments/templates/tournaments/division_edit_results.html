{% extends "base.html" %}
{% load static %}

{% block title %}Edit Results - {{ division.name }} - {{ division.tournament.name }} - Baxter{% endblock %}

{% block content %}
<h1>Edit Results: {{ division.name }}</h1>
<p><a href="{% url 'division_detail' division.pk %}">Back to division</a></p>

<link rel="stylesheet" href="{% static 'tabulator-tables/dist/css/tabulator.min.css' %}">
<script src="{% static 'tabulator-tables/dist/js/tabulator.min.js' %}"></script>

<div id="results-table"></div>

<p style="margin-top: 1em;">
    <button id="add-row-btn" type="button">Add Row</button>
    <button id="save-btn" type="button">Save</button>
    <span id="save-status"></span>
</p>

<script>
const pageData = {
    entrants: {{ entrants_json|safe }},
    results: {{ results_json|safe }},
    csrfToken: "{{ csrf_token }}",
};
</script>
<script src="{% static 'tournaments/js/edit_results.js' %}"></script>
{% endblock %}
