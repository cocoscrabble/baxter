[project]
name = "baxter"
version = "0.1.0"
description = "Efficient scrabble tournament manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coco-ratings",
    "dataclasses-json>=0.6.7",
    "datastar-py>=0.8.0",
    "django>=6.0.2",
    "django-environ>=0.11",
    "django-node-assets>=0.9.15",
    "gunicorn>=25.1.0",
    "psycopg2-binary>=2.9",
    "python-docx>=1.2.0",
    "qrcode[pil]>=8.2",
    "scrabble-pairing-py",
    "whitenoise>=6.0",
]

[tool.uv.sources]
# Local PyO3 extension crate; uv builds the wheel via maturin on `uv sync`.
# uv does not watch the crate source — after editing Rust, rebuild with
# `uv sync --reinstall-package scrabble-pairing-py` (or `make rust-engine`).
scrabble-pairing-py = { path = "scrabble-pairing-py" }

# The CoCo rating engine (../ratings), shared so live in-tournament rating
# projections use the *same* math as the official ratings rather than a second
# implementation of it. Import only `coco_ratings.core`: it is dependency-free
# by contract, enforced over there by tests/test_core_isolation.py.
#
# Tracks main; uv.lock pins the exact commit, so builds are reproducible and an
# upgrade is a deliberate `uv lock --upgrade-package coco-ratings`. A path
# dependency cannot work — the Docker build has no access to ../ratings.
coco-ratings = { git = "https://github.com/cocoscrabble/ratings.git", branch = "main" }

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.2.0",
    "django-types>=0.24.0",
    "ipython>=9.10.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "ruff>=0.15.0",
]
