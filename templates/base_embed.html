{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baxter{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="embed-header">
        <a href="https://cocoscrabble.org" class="embed-logo-link">
            <img src="{% static 'img/logo.png' %}" alt="COCO logo" class="embed-logo">
        </a>
    </header>
    <main class="embed-page">
    {% block content %}{% endblock %}
    </main>
    <script type="module" src="{% static 'js/datastar.js' %}"></script>
</body>
</html>
