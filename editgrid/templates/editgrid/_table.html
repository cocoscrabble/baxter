{% load static %}
<div id="{{ grid.dom_id }}" class="mt-md"></div>
<script>
(window.editgrids = window.editgrids || {})["{{ grid.dom_id }}"] = Object.assign(
    (window.editgrids["{{ grid.dom_id }}"] || {}),
    {
        rows: {{ grid.rows_json|safe }},
        lookups: {{ grid.lookups_json|safe }},
        columns: {{ grid.columns_json|safe }},
        version: {{ grid.version }},
        csrfToken: "{{ csrf_token }}",
        saveUrl: "{{ grid.save_url }}",
        autoInit: {{ grid.auto_init|yesno:"true,false" }},
        focusField: "{{ grid.focus_field }}",
    }
);
</script>
<script type="module" src="{% static grid.js_module %}"></script>
